repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend, v3.8.3)
        entry: frontend/node_modules/.bin/prettier --write --config frontend/.prettierrc.json
        language: system
        types_or: [javascript, jsx, ts, tsx, css, json, yaml]
        files: ^frontend/
