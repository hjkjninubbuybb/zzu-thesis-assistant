[project]
name = "rag1-0"
version = "0.1.0"
description = "RAG 毕设项目 - 纯文本RAG系统"
authors = [
    {name = "hjkjninubbuybb", email = "fengge1230611@gmail.com"}
]
requires-python = ">=3.10,<4.0"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # LLM & Embedding
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    "dashscope>=1.20.0",
    # Vector DB
    "qdrant-client>=1.12.0",
    # BM25
    "bm25s>=0.2.0",
    "jieba>=0.42.1",
    # Reranker
    "llama-index-core>=0.12.0",
    "llama-index-postprocessor-dashscope-rerank>=0.3.0",
    "llama-index-embeddings-dashscope>=0.3.0",
    # Document parsing
    "pymupdf4llm>=0.0.10",
    # Config
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    # Auth
    "python-jose[cryptography] (>=3.3.0)",
    "passlib[bcrypt] (>=1.7.4)",
    "bcrypt (>=3.0.0,<5.0.0)",
    # MySQL
    "pymysql (>=1.1.0)",
    "dbutils (>=3.1.0)",
    # Misc
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
    "openpyxl>=3.1.0",
    "python-docx (>=1.2.0,<2.0.0)",
]

[tool.poetry]
packages = [{include = "src"}]

[tool.poetry.scripts]
start = "src.main:run"
dev = "src.main:dev"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
