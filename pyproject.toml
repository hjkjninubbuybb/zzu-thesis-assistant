[project]
name = "rag1-0"
version = "0.1.0"
description = "RAG 毕设项目 - 纯文本RAG系统"
authors = [
    {name = "hjkjninubbuybb", email = "fengge1230611@gmail.com"}
]
requires-python = ">=3.10,<4.0"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # LLM & Embedding
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    "dashscope>=1.20.0",
    # Vector DB
    "qdrant-client>=1.12.0",
    # BM25
    "bm25s>=0.2.0",
    "jieba>=0.42.1",
    # Reranker
    "llama-index-core>=0.12.0",
    "llama-index-postprocessor-dashscope-rerank>=0.3.0",
    "llama-index-embeddings-dashscope>=0.3.0",
    # Document parsing
    "pymupdf4llm>=0.0.10",
    # Config
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    # Auth
    "python-jose[cryptography] (>=3.3.0)",
    "passlib[bcrypt] (>=1.7.4)",
    "bcrypt (>=3.0.0,<4.0.0)",
    # MySQL
    "pymysql (>=1.1.0)",
    "dbutils (>=3.1.0)",
    # Misc
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
    "openpyxl>=3.1.0",
    "python-docx (>=1.2.0,<2.0.0)",
    "langchain-openai (>=1.2.1,<2.0.0)",
]

[tool.poetry]
packages = [{include = "src"}]

[tool.poetry.scripts]
start = "src.main:run"
dev = "src.main:dev"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.14,<0.16.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "pytest (>=8.0.0)",
    "pytest-asyncio (>=0.25.0)",
    "httpx (>=0.28.0)",
]

# ── Ruff ─────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade (modernize syntax)
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "D",      # pydocstyle (Google convention)
    "RUF",    # Ruff-specific rules
]
ignore = [
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method
    "D107",   # Missing docstring in __init__
    "D203",   # Conflicts with D211
    "D213",   # Conflicts with D212
    "E501",   # Line too long (handled by formatter)
    "RUF001", # Ambiguous unicode in string (中文项目)
    "RUF002", # Ambiguous unicode in docstring (中文项目)
    "RUF003", # Ambiguous unicode in comment (中文项目)
    "D101",   # Missing docstring in public class (渐进补充)
    "D102",   # Missing docstring in public method (渐进补充)
    "D103",   # Missing docstring in public function (渐进补充)
    "D415",   # Missing terminal punctuation in docstring (中文句号兼容)
    "B008",   # Function call in default argument (FastAPI Depends 模式)
    "D205",   # Blank line between summary and description (tool docstring 需紧凑)
    "D417",   # Missing argument description in docstring (渐进补充)
    "N806",   # Variable in function should be lowercase (局部常量允许)
    "B905",   # zip() without strict= (列表等长已保证)
    "D200",   # One-line docstring should fit on one line
]

[tool.ruff.lint.per-file-ignores]
"src/core/rag_pipeline.py" = ["F841", "RUF005"]  # 预留变量 + 列表拼接风格
"src/storage/*.py" = ["W291", "RUF005", "SIM117"]  # SQL 多行字符串尾部空格 + 列表拼接 + with 合并
"src/api/app.py" = ["E402"]  # warnings 过滤必须在 import 前
"src/api/routes/*.py" = ["B904", "B005", "B007", "RUF005"]  # HTTPException 异常链 + strip 多字符 + 循环变量
"tests/**/*.py" = ["D", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require a running MySQL instance",
]
