# RAG 1.0 全局配置

qdrant:
  url: ${QDRANT_URL:-http://localhost:6333}
  timeout: 30

embedding:
  model: text-embedding-v3
  dimension: 1024
  embed_batch_size: 10

llm:
  model: qwen-plus

splitter:
  chunk_size: 256
  chunk_overlap_ratio: 0.2
  separators: "chinese_markdown"

retrieval:
  vector_top_k: 10
  bm25_top_k: 10
  hybrid_top_k: 15
  rrf_k: 60

reranker:
  model: gte-rerank
  top_n: 5

rag:
  max_reformulations: 2

server:
  api_host: "0.0.0.0"
  api_port: 8000
